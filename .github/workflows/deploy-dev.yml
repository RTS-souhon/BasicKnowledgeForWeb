name: Deploy to Dev Environment

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project

      - name: Run database migrations
        run: |
          cd apps/backend
          bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers (Dev)
        id: deploy-backend
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.105.0
          command: deploy --env dev
          workingDirectory: apps/backend
          secrets: |
            DATABASE_URL
            JWT_SECRET
          environment: dev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Notify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-backend.outputs.deployment-url }}
        run: |
          echo "✅ Backend deployed to dev environment successfully!"
          echo "Worker: basic-knowledge-for-web-backend-dev"
          echo "Deployment URL: ${DEPLOYMENT_URL}"

  deploy-frontend:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project

      - name: Build frontend
        run: |
          cd apps/frontend
          rm -f .env .env.local .env.production .env.development
          {
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "JWT_SECRET=${JWT_SECRET}"
          } > .env.production
          bun run build:cloudflare
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Verify R2 cache bucket access (Dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: basic-knowledge-for-web-next-cache-dev
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          set +e
          http_status="$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 -sS \
            -o "${response_file}" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET_NAME}")"
          curl_exit="$?"
          set -e

          echo "R2 bucket API curl exit code: ${curl_exit}"
          echo "R2 bucket API HTTP status: ${http_status}"
          python - "${response_file}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          body = open(path, encoding='utf-8').read()
          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print('R2 bucket API response is not JSON:')
              print(body[:2000])
              sys.exit(0)

          print(f"R2 bucket API success: {data.get('success')}")
          print(f"R2 bucket API errors: {json.dumps(data.get('errors'), ensure_ascii=False)}")
          print(f"R2 bucket API messages: {json.dumps(data.get('messages'), ensure_ascii=False)}")
          result = data.get('result')
          if isinstance(result, dict):
              print(f"R2 bucket API result name: {result.get('name')}")
              print(f"R2 bucket API result jurisdiction: {result.get('jurisdiction')}")
          PY

          if [ "${curl_exit}" -ne 0 ] || [ "${http_status}" != "200" ]; then
            exit 1
          fi

      - name: Build and deploy to Cloudflare Workers (Dev)
        id: deploy-frontend
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.105.0
          command: deploy --env dev
          workingDirectory: apps/frontend
          secrets: |
            JWT_SECRET
          environment: dev
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Notify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-frontend.outputs.deployment-url }}
        run: |
          echo "✅ Frontend deployed to dev environment successfully!"
          echo "Worker: basic-knowledge-for-web-frontend-dev"
          echo "Deployment URL: ${DEPLOYMENT_URL}"
