name: Deploy to Dev Environment

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup backend dependencies
        uses: ./.github/actions/setup-bun-project
        with:
          working-directory: apps/backend

      - name: Run database migrations
        run: |
          cd apps/backend
          bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers (Dev)
        id: deploy-backend
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          workingDirectory: apps/backend
          secrets: |
            DATABASE_URL
            JWT_SECRET
          environment: dev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Notify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-backend.outputs.deployment-url }}
        run: |
          echo "✅ Backend deployed to dev environment successfully!"
          echo "Worker: basic-knowledge-for-web-backend-dev"
          echo "Deployment URL: ${DEPLOYMENT_URL}"

  deploy-frontend:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-bun-project
        with:
          working-directory: apps/frontend

      - name: Build frontend
        run: |
          cd apps/frontend
          rm -f .env .env.local .env.production .env.development
          {
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "JWT_SECRET=${JWT_SECRET}"
          } > .env.production
          bun run build:cloudflare
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build and deploy to Cloudflare Workers (Dev)
        id: deploy-frontend
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          workingDirectory: apps/frontend
          secrets: |
            JWT_SECRET
          environment: dev
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Notify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-frontend.outputs.deployment-url }}
        run: |
          echo "✅ Frontend deployed to dev environment successfully!"
          echo "Worker: basic-knowledge-for-web-frontend-dev"
          echo "Deployment URL: ${DEPLOYMENT_URL}"
