name: Dependabot - Update bun.lock

on:
  workflow_run:
    workflows: ["Pull Request Build & Test"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-bun-lock:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project
        with:
          install: "false"

      - name: Update bun.lock safely
        run: bun install --ignore-scripts

      - name: Commit and push bun.lock if updated
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$(git status --porcelain bun.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): update bun.lock"
            git push "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${HEAD_REF}"
          fi
