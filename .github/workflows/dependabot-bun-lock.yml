name: Dependabot - Update bun.lock

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update-bun-lock:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # GITHUB_TOKEN による push は新たな CI ワークフロー（pull-request.yml 等）を再トリガーしないため、
          # PAT (Personal Access Token) 等の Secret が設定されている場合は優先して使用します。
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project
        with:
          install: "false"

      - name: Update bun.lock safely
        run: bun install --ignore-scripts

      - name: Commit and push bun.lock if updated
        run: |
          if [ -n "$(git status --porcelain bun.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): update bun.lock"
            git push
          fi
