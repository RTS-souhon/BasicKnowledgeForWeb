name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Security-scan-for-dependencies:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: "refs/pull/${{ github.event.number }}/merge"

      # Bunをセットアップ
      - name: Setup root package manager
        uses: ./.github/actions/setup-bun-project
        with:
          install: "false"

      # AikidoSec Safe Chainをセットアップ
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Verify safe-chain
        run: bun safe-chain-verify

      - name: Scan dependencies with safe-chain
        run: bun install

      # Betterleaksをセットアップ
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main

      - name: Betterleaks scan
        run: |
          brew install betterleaks/tap/betterleaks
          betterleaks git .

      # Anti-trojan-sourceをセットアップ
      - name: Install anti-trojan-source
        run: |
          bun install anti-trojan-source

      - name: Anti-trojan-source scan
        run: |
          bunx anti-trojan-source --scan .

      # GitHub Actions workflowをzizmorでスキャン
      - name: Zizmor scan
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
